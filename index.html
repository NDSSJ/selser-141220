<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Melegim ❤️</title>
    <link rel="icon" type="image/png" href="Images/TabIcon.png">
    <!-- STYLES -->
    <link rel="stylesheet" href="styles.css" />
    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <!-- ======================== LOGIN-BEREICH ======================== -->
    <section id="login">
        <div class="login-card">
            <h1>Hello Melegim 👋❤️</h1>
            <p>Melde dich an Selis, Account ist schon erstellt</p>
            <p>Email hast du, Passwort errätst du schon</p>

            <!-- ========== LOGIN ========== -->
            <h2>Anmelden</h2>
            <input type="text" id="loginIdentity" placeholder="Email oder Benutzername" />
            <input type="password" id="loginPassword" placeholder="Passwort" />
            <button id="loginBtn">Anmelden</button>
            <p id="loginMsg" class="msg"></p>

            <hr style="margin:1.3rem 0; border:0; border-top:1px solid rgba(255,255,255,.05);" />

            <!-- ========== REGISTRIERUNG ========== -->
            <h2>Registrieren</h2>
            <input type="email" id="regEmail" placeholder="Email" />
            <input type="text" id="regUsername" placeholder="Benutzername" />
            <input type="password" id="regPassword" placeholder="Passwort" />
            <button id="signupBtn">Account erstellen</button>
            <p id="signupMsg" class="msg"></p>
        </div>
    </section>

    <!-- SCRIPT -->
    <script src="https://cdn.jsdelivr.net/npm/winwheel.js@2.8.0/dist/Winwheel.min.js"></script>
    <script src="js/wheel.js"></script>
    <script src="js/slideshow.js"></script>
    <script src="js/lovecalc.js"></script>
    <script src="js/whosaidit.js"></script>
    <script src="js/OurSongs.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/dailymessage.js"></script>
    <script src="js/FoodList.js"></script>
    <script src="js/datelist.js"></script>
    <script src="js/giftideas.js"></script>
    <script src="js/wop.js"></script>
    <script src="js/shortfilm.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/Intro.js"></script>


</body>

</html>
